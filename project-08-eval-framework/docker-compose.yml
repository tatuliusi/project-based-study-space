version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: evaldb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d evaldb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
